name: Codex Engineering System CI

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".codex/agents/**"
      - ".codex/config.toml.example"
      - "codex/**"
      - "docs/codex-engineering-system.md"
      - "tools/codex_lanes.py"
      - "tools/install_codex_engineering_system.py"
      - "tools/validate_codex_engineering_system.py"
      - ".github/workflows/codex-engineering-system-ci.yml"
  push:
    branches:
      - main
    paths:
      - ".agents/skills/**"
      - ".codex/agents/**"
      - ".codex/config.toml.example"
      - "codex/**"
      - "docs/codex-engineering-system.md"
      - "tools/codex_lanes.py"
      - "tools/install_codex_engineering_system.py"
      - "tools/validate_codex_engineering_system.py"
      - ".github/workflows/codex-engineering-system-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-engineering-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Codex workflow system
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python tools
        run: |
          python -m py_compile \
            tools/codex_lanes.py \
            tools/install_codex_engineering_system.py \
            tools/validate_codex_engineering_system.py

      - name: Validate skills, agents, installer, and worktree lifecycle
        run: python tools/validate_codex_engineering_system.py

      - name: Check whitespace
        run: git diff --check
