name: README CI

on:
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/**"
      - ".markdownlint.jsonc"
      - ".markdown-link-check.json"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/**"
      - ".markdownlint.jsonc"
      - ".markdown-link-check.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate README and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.0 README.md

      - name: Check Markdown links
        run: npx --yes markdown-link-check@3.14.2 README.md --config .markdown-link-check.json

      - name: Validate critical external assets
        shell: bash
        run: |
          set -euo pipefail

          validate_svg() {
            local url="$1"
            local file
            file="$(mktemp)"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors "$url" --output "$file"
            test -s "$file"
            grep --quiet '<svg' "$file"
            rm --force "$file"
          }

          validate_gif() {
            local url="$1"
            local file
            file="$(mktemp)"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors "$url" --output "$file"
            test "$(file --brief --mime-type "$file")" = "image/gif"
            rm --force "$file"
          }

          validate_svg "https://raw.githubusercontent.com/RoryGlenn/RoryGlenn/output/github-contribution-grid-snake.svg"
          validate_svg "https://raw.githubusercontent.com/RoryGlenn/RoryGlenn/output/github-contribution-grid-snake-dark.svg"
          validate_gif "https://raw.githubusercontent.com/RoryGlenn/commitment-issues/main/assets/demo.gif"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            "https://registry.npmjs.org/commitment-issues/latest" \
            --output /dev/null

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.x"
          cache: false

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
