name: Rory Operating System CI

on:
  pull_request:
    paths:
      - "tools/bootstrap_rory_operating_system.py"
      - ".github/workflows/rory-operating-system-ci.yml"
  push:
    branches:
      - main
    paths:
      - "tools/bootstrap_rory_operating_system.py"
      - ".github/workflows/rory-operating-system-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rory-operating-system-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Compile bootstrap
        run: python -m py_compile tools/bootstrap_rory_operating_system.py

      - name: Validate static GraphQL documents
        run: python tools/bootstrap_rory_operating_system.py --self-check
